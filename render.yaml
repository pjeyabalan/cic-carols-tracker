# Render Blueprint for CIC Carols Tracker (100% Free Tier — No Credit Card Required)
# Deploys to its own standalone hostname: https://cic-carols-tracker.onrender.com

services:
  - type: web
    name: cic-carols-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --threads 8 -w 1 --timeout 120 -b 0.0.0.0:$PORT tracker.web:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_TIMEZONE
        value: America/Chicago
      - key: DATABASE_URL
        sync: false
