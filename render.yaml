# Render Blueprint for CIC Carols Tracker
# Deploys to its own standalone hostname: https://cic-carols-tracker.onrender.com
# Completely independent from tbq-jbq.

databases:
  - name: carols-database
    databaseName: carols
    user: carols_user
    # 'basic-256mb' (~$6/mo) never expires or auto-deletes data (unlike Render's 30-day free DB),
    # and works alongside any existing free DB on your Render account.
    plan: basic-256mb

services:
  - type: web
    name: cic-carols-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT tracker.web:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_TIMEZONE
        value: America/Chicago
      - key: DATABASE_URL
        fromDatabase:
          name: carols-database
          property: connectionString
